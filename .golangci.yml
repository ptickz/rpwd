version: "2"

linters:
  default: none
  enable:
    - nilnil
    - nilerr
    - errorlint
    - wrapcheck
    - staticcheck
    - govet
    - errcheck
    - gosec
    - wsl_v5
  exclusions:
      rules:
        - path: internal/vault/encoding.go
          linters: [gosec]
          text: "G115"

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ptickz/rpwd)
run:
  timeout: 5m
  tests: true