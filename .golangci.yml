version: "2"

linters:
  default: none
  enable:
    - nilnil
    - nilerr
    - errorlint
    - wrapcheck
    - staticcheck
    - govet
    - errcheck
    - gosec
    - wsl_v5
    - godot
    - revive
  settings:
    revive:
      rules:
        - name: package-comments
        # exported: описания каждого экспортируемого имени — на этапе 7 (документация).
  exclusions:
      rules:
        - path: internal/vault/encoding.go
          linters: [gosec]
          text: "G115"
        - path: internal/store/
          linters: [gosec]
          text: "G304"

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ptickz/rpwd)
run:
  timeout: 5m
  tests: true